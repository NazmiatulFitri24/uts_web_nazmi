        <h1>Formulir Booking Servis Online </h1>
        <p>Pilih jadwal kedatangan anda untuk menghindari antrean panjang di bengkel</p>
        <form action="proses.php" method="post">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required >
            <br>
            <label for="mobil">Model / Merek Mobil</label>
            <input type="text" id="mobil" name="mobil" placeholder="Contoh: Toyota Avanza (B 1234 XYZ)" required>
            <br>
            <label for="whatsapp">Nomor Telepon (WhatsApp)</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="Contoh: 0812-3456-7890" required>
            <br>
            <label for="tanggal">Pilih Tanggal Servis</label>
            <input type="date" id="tanggal" name="tanggal" required>
            <br>
            <label for="servis">Keluhan / Jenis Servis</label>
            <textarea id="pesan" name="pesan" rows="4" placeholder="Contoh: Rem berdencit dan mesin terasa kurang bertenaga..." required></textarea><br><br>
            <br>
            <input type="submit" value="Kirim Permintaan Booking">
            </select>
        </form>
